name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

env:
  OCI_REGISTRY: ghcr.io
  OCI_OWNER: braghettos

jobs:
  package-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Derive versions from git tag
        run: |
          CHART_VERSION="${GITHUB_REF_NAME}"
          echo "CHART_VERSION=${CHART_VERSION}" >> "$GITHUB_ENV"

          REPO_CHART_NAME="${{ github.repository }}"
          REPO_APP_NAME=$(echo "$REPO_CHART_NAME" | sed 's/-chart$//')

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${REPO_APP_NAME}")

          if [[ "$HTTP_STATUS" -eq 200 ]]; then
            APP_VERSION=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${REPO_APP_NAME}/releases/latest" \
              | jq -r '.tag_name // empty')
          fi

          APP_VERSION="${APP_VERSION:-$CHART_VERSION}"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Print versions
        run: |
          echo "CHART_VERSION: ${{ env.CHART_VERSION }}"
          echo "APP_VERSION:   ${{ env.APP_VERSION }}"

      - name: Patch Chart.yaml versions
        run: |
          sed -i "s/CHART_VERSION/${{ env.CHART_VERSION }}/g" ./chart/Chart.yaml
          sed -i "s/APP_VERSION/${{ env.APP_VERSION }}/g"     ./chart/Chart.yaml
          sed -i "s/CHART_VERSION/${{ env.CHART_VERSION }}/g" ./crd-chart/Chart.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.OCI_REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Package crd-chart
        run: helm package ./crd-chart --destination ./.helm-packages

      - name: Push crd-chart OCI artifact
        run: helm push ./.helm-packages/frontend-crd-${{ env.CHART_VERSION }}.tgz oci://${{ env.OCI_REGISTRY }}/${{ env.OCI_OWNER }}

      - name: Build chart dependencies
        run: helm dependency build ./chart

      - name: Package chart
        run: helm package ./chart --destination ./.helm-packages

      - name: Push chart OCI artifact
        run: helm push ./.helm-packages/frontend-${{ env.CHART_VERSION }}.tgz oci://${{ env.OCI_REGISTRY }}/${{ env.OCI_OWNER }}

      - name: Summary
        run: |
          echo "### Helm Charts Published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Chart | Version | OCI Reference |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|---------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`frontend\` | \`${{ env.CHART_VERSION }}\` | \`oci://${{ env.OCI_REGISTRY }}/${{ env.OCI_OWNER }}/frontend\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`frontend-crd\` | \`${{ env.CHART_VERSION }}\` | \`oci://${{ env.OCI_REGISTRY }}/${{ env.OCI_OWNER }}/frontend-crd\` |" >> "$GITHUB_STEP_SUMMARY"
