# Canonical OCI publish workflow for Krateo blueprint-fork charts (chart/ + optional
# crd-chart/). Publishes both to the consolidated registry oci://ghcr.io/braghettos/krateo
# on a semver tag push. Identical across all single-chart krateo-* fork repos.
#
# OCI-NAME-COLLISION GUARD (frontend repo): `helm push <chart>.tgz <OCI_REPO>`
# derives the artifact repository as <OCI_REPO>/<Chart.yaml name>. This repo's
# chart is named `frontend` and its crd-chart `frontend-crd` — the SAME strings
# as the frontend SPA's own Docker image at ghcr.io/braghettos/frontend (built
# by braghettos/frontend with tags latest/buildcache/1.0.x). If OCI_REPO is ever
# the registry ROOT (oci://ghcr.io/braghettos), the chart pushes to
# ghcr.io/braghettos/frontend and COLLIDES with that image — intermixing a Helm
# chart manifest and a container image manifest under one OCI repository. That
# is exactly what produced the stray bare `frontend` + `frontend-crd` packages
# in the org registry (sibling charts snowplow/portal have NO such bare dup —
# their chart artifacts live only under krateo/ and charts/). The `Assert
# chart-namespaced OCI_REPO` step below makes a root-level push a hard failure,
# so the chart artifact can never re-collide with the image namespace.
name: release-oci

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

env:
  OCI_REPO: oci://ghcr.io/braghettos/krateo

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set versions
        id: ver
        run: |
          CHART_VERSION="${GITHUB_REF_NAME}"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          # appVersion defaults to chart version unless already pinned in Chart.yaml
          echo "app_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Substitute version placeholders
        run: |
          for f in chart/Chart.yaml crd-chart/Chart.yaml; do
            [ -f "$f" ] || continue
            sed -i "s/CHART_VERSION/${{ steps.ver.outputs.chart_version }}/g" "$f"
            sed -i "s/APP_VERSION/${{ steps.ver.outputs.app_version }}/g" "$f"
          done

      # OCI-name-collision guard: refuse to publish unless OCI_REPO carries a
      # chart-namespace path segment under the host/org (e.g. .../krateo or
      # .../charts). A bare registry root (oci://ghcr.io/<org>) would push the
      # `frontend` chart to ghcr.io/<org>/frontend and collide with the frontend
      # SPA image of the same name. Fail fast here, before login/package/push.
      - name: Assert chart-namespaced OCI_REPO (no registry-root push)
        run: |
          # Strip the oci:// scheme, then require at least host / org / namespace.
          path="${OCI_REPO#oci://}"
          segs="$(printf '%s' "$path" | tr '/' '\n' | grep -c .)"
          if [ "$segs" -lt 3 ]; then
            echo "::error::OCI_REPO='${OCI_REPO}' is the registry root (only ${segs} path segments)."
            echo "::error::Charts named 'frontend'/'frontend-crd' would collide with the frontend SPA"
            echo "::error::image at ghcr.io/braghettos/frontend. Use a chart-namespaced repo, e.g."
            echo "::error::oci://ghcr.io/braghettos/krateo."
            exit 1
          fi
          echo "OCI_REPO='${OCI_REPO}' is chart-namespaced (${segs} segments) — no image collision."

      - name: Helm setup
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      - name: Registry login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package & push crd-chart (if present)
        run: |
          if [ -f crd-chart/Chart.yaml ]; then
            # crd-chart packages deterministically to <name>-<version>.tgz with a
            # single artifact in dist/. Push that one tgz explicitly — no error-
            # swallowing fallback (the old `... 2>/dev/null || helm push $(ls ...
            # | head -1)` masked real push failures and could push the wrong
            # artifact if dist/ ever held more than one tgz).
            helm package crd-chart -d dist/
            tgz="$(ls dist/*.tgz)"
            test "$(printf '%s\n' "$tgz" | grep -c .)" -eq 1 || { echo "::error::expected exactly one crd-chart tgz, got: $tgz"; exit 1; }
            helm push "$tgz" "${OCI_REPO}"
            rm -rf dist
          fi

      - name: Build deps & package chart
        run: |
          helm dependency build chart || true
          helm package chart -d dist/

      - name: Push chart
        run: helm push dist/*.tgz "${OCI_REPO}"

      - name: Package & push the federated agent chart (if present)
        run: |
          if [ -f kagent/chart/Chart.yaml ]; then
            helm package kagent/chart -d dist-agent/
            helm push dist-agent/*.tgz "${OCI_REPO}"
          fi
