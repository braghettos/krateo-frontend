{{- /*
Draft object-count quota for the preview sandbox.

Kubernetes has NO aggregate object count across a CRD group, so the quota is
one count/<plural>.<group> entry PER widget kind, generated from
.Values.previewSandbox.widgetPlurals (the list mirrors the 42 CRDs in
crds-subchart/templates and is visible/overridable in values.yaml), plus one
entry for RESTActions. Bounds a runaway agent: the apiserver rejects over-quota
creates with a clean error the agent can consume (prototype A.1.6).
*/ -}}
{{- if .Values.previewSandbox.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview-widget-count
  namespace: {{ .Values.previewSandbox.namespace }}
  labels:
    krateo.io/purpose: preview-sandbox
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  hard:
    {{- range .Values.previewSandbox.widgetPlurals }}
    count/{{ . }}.widgets.templates.krateo.io: {{ $.Values.previewSandbox.quota.perWidgetKind | quote }}
    {{- end }}
    count/restactions.templates.krateo.io: {{ .Values.previewSandbox.quota.restactions | quote }}
{{- end }}
