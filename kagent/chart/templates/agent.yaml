apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: krateo-frontend-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: krateo-frontend-agent
    app.kubernetes.io/part-of: krateo-frontend
spec:
  type: Declarative
  description: >-
    Krateo frontend specialist that authors and server-dry-run-validates Composable Portal widget CRs
    (widgets.templates.krateo.io/v1beta1 kinds Flex, Row, Col, Tabs, Paragraph, Markdown, Card, Statistic,
    Table, Listy, Button, PieChart, LineChart, BarChart) for portal pages and dashboards, grounded on braghettos/krateo-frontend-chart docs
    and delegating any new RESTAction data source to the snowplow agent.
  declarative:
    deployment:
      env:
{{- include "frontend-agent.genaiEnv" . | nindent 8 }}
    modelConfig: {{ .Values.modelConfig.name }}
    stream: true
    promptTemplate:
      dataSources:
        - kind: ConfigMap
          name: frontend-agent-prompts-{{ .Values.prompts.language }}
          alias: prompts
    systemMessage: |
      {{`{{include "prompts/frontend_agent"}}`}}
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          apiGroup: kagent.dev
{{- with .Values.requireApproval }}
          # kagent GRANULAR HITL: exactly these tools pause for human approval (requireApproval).
          # Empty list (the default) gates NOTHING — the frontend-agent's k8s_apply_manifest is a
          # non-mutating server dry-run validator; the real write gate is downstream at publishPage.
          requireApproval:
{{ toYaml . | indent 12 }}
{{- end }}
          toolNames:
            - k8s_get_resources
            - k8s_get_resource_yaml
            - k8s_apply_manifest
{{- if .Values.fetch.enabled }}
      # Tokenless doc grounding: GET the version-pinned raw docs/llms.txt URL (public, no auth/token).
      - type: McpServer
        mcpServer:
          name: {{ .Values.fetch.mcpServer }}
          kind: MCPServer
          apiGroup: kagent.dev
          toolNames:
            - fetch
{{- end }}
{{- if .Values.github.enabled }}
      - type: McpServer
        mcpServer:
          name: {{ .Values.github.mcpServer }}
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - get_file_contents
            - search_code
{{- end }}
{{- if .Values.snowplowAgent.enabled }}
      # RestAction domain expert. The frontend-agent OWNS widget authoring but its prompt DELEGATES
      # any NEW server-side data source (a RestAction) to the snowplow specialist — this Agent tool
      # is what makes that delegation possible. Without it the agent has to author the RA itself and
      # Gemini stalls out empty on the combined page (the reason external-RA pages never rendered).
      - type: Agent
        agent:
          name: {{ .Values.snowplowAgent.name }}
{{- end }}
    a2aConfig:
      skills:
        - id: compose-portal-pages
          name: Compose Portal pages and dashboards
          description: >-
            Authors a validated set of Composable Portal widget CRs for a page/dashboard, rooted in a
            Flex named page-<slug> that lists its children, then returns the ordered CR set.
          tags: [krateo, frontend, portal, widgets, dashboard]
          examples:
            - Build a dashboard page with a heading paragraph and a table of compositions.
            - Create a portal page with a Flex column containing a Card and a Statistic.
            - Lay out a page using Tabs with a Table in each tab.
        - id: author-widget-crs
          name: Author and dry-run widget CRs
          description: >-
            Drafts individual widgets.templates.krateo.io/v1beta1 widget CRs (Table, Paragraph, Button,
            Card, Statistic, Markdown, etc.) and self-validates each via server dry-run against the live
            CRD before returning.
          tags: [krateo, widgets, crd, dry-run, validation]
          examples:
            - Create a Table widget whose rows come from the compositions-list RESTAction via apiRef.
            - Add a Button widget and a strong Paragraph heading to the page.
            - Validate this Card widget CR against the cluster before we publish it.
    deployment:
      resources:
{{- toYaml .Values.resources | nindent 8 }}
