namespace: krateo-system
# ModelConfig for this agent. By default it REFERENCES a ModelConfig by name (e.g. one the
# autopilot ships: gemini-flash / gemini-pro). Set create=true to provision a DEDICATED ModelConfig
# for THIS agent, so it can use a different model/provider independently of the other agents.
modelConfig:
  # gemini-pro (not flash): this agent AUTHORS + self-validates widget CRs — same reason the
  # blueprint author (helm-agent) runs on pro. Authoring valid CRs + reading dry-run errors needs
  # the stronger model; the author->dry-run->fix loop in the prompt is the correctness backstop.
  name: gemini-pro
  create: false
  provider: GeminiVertexAI          # GeminiVertexAI (ADC) | Gemini (API key) | Anthropic | OpenAI
  model: gemini-2.5-flash
  vertexAI:                         # used when provider == GeminiVertexAI
    projectID: ""
    location: us-central1
  apiKeySecret: ""                  # used when the provider needs a key (Gemini/Anthropic/OpenAI)
  apiKeySecretKey: ""
prompts:
  language: eng

# kagent GRANULAR HITL — requireApproval is the exact list of tool NAMES that pause for human approval.
# EMPTY here on purpose: the frontend-agent's only mutating-shaped tool, k8s_apply_manifest, is used
# ONLY as a server DRY-RUN validator (--dry-run=server, writes nothing) and it returns the authored CRs
# to the orchestrator — it never applies to the real cluster. The meaningful human write gate is
# DOWNSTREAM at publishPage (the frontend's blast-radius confirm on the git-write). Gating the
# non-mutating dry-run only stalled the author loop with a click per validation. To gate a REAL apply,
# add its tool name (e.g. "k8s_apply_manifest") here. The installer can override this per-agent.
requireApproval: []
vertexAI:
  enabled: true
  projectID: ""
  location: us-central1
# Tokenless fetch MCP (kagent MCPServer, fetch-mcp-server) — GETs the version-pinned public raw
# docs/llms.txt URL (no token/auth). This is the default grounding path; the chart stamps the
# deployed tag into the URL in the prompt footer.
fetch:
  enabled: true
  mcpServer: fetch-mcp-server

# github MCP server for DEEPER source reading (search_code, etc.) — OPT-IN, off by default: it
# requires the github-mcp-server running with a PAT. Doc grounding uses the tokenless fetch tool above.
github:
  enabled: false
  mcpServer: github-mcp-server
# The RestAction domain expert, wired in as a delegatable sub-agent. The frontend-agent OWNS widget
# authoring and DELEGATES any new server-side data source (a RestAction) to snowplow-agent; without
# this Agent tool the delegation is impossible and the agent stalls authoring external-RA pages.
snowplowAgent:
  enabled: true
  name: krateo-snowplow-agent
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
