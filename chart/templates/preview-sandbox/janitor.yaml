{{- /*
TTL janitor for the preview sandbox (w4 spec Addendum A.4).

DESIGN — simplest honest mechanism, chosen deliberately:
- The frontend's drawer-close DELETE is the fast path; this CronJob is the
  BACKSTOP for dead tabs/sessions. No frontend timer (tabs die), no controller
  work, no cluster-wide rights.
- Hourly bitnami/kubectl job under a namespace-local ServiceAccount whose Role
  grants get/list/delete ONLY on the widget group + restactions, ONLY in this
  namespace — the janitor cannot touch anything outside the sandbox.
- Sweep = kubectl delete by creationTimestamp cutoff: for each resource kind it
  lists name+creationTimestamp (jsonpath — no jq dependency) and deletes items
  older than now - TTL. creationTimestamp is RFC3339 UTC, so a lexicographic
  string compare against the cutoff is exact; no label selector on purpose —
  EVERYTHING of these kinds in the sandbox is a draft by construction (the
  namespace boundary is the selector), so an unlabeled hand-applied draft still
  gets cleaned. Widget CRs accrue no server-written status (snowplow compiles
  spec->status in-memory), so age-based deletion loses nothing.
- TTL comes from .Values.previewSandbox.ttl — the SAME value stamped as the
  namespace's krateo.io/ttl label, so the advertised and enforced TTL cannot
  drift. The resource list comes from .Values.previewSandbox.widgetPlurals
  (same list that generates the quota).
*/ -}}
{{- if .Values.previewSandbox.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-sandbox-janitor
  namespace: {{ .Values.previewSandbox.namespace }}
  labels:
    krateo.io/purpose: preview-sandbox
    {{- include "frontend.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-sandbox-janitor
  namespace: {{ .Values.previewSandbox.namespace }}
  labels:
    krateo.io/purpose: preview-sandbox
    {{- include "frontend.labels" . | nindent 4 }}
rules:
  - apiGroups: ["widgets.templates.krateo.io"]
    resources: ["*"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["templates.krateo.io"]
    resources: ["restactions"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-sandbox-janitor
  namespace: {{ .Values.previewSandbox.namespace }}
  labels:
    krateo.io/purpose: preview-sandbox
    {{- include "frontend.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: preview-sandbox-janitor
subjects:
  - kind: ServiceAccount
    name: preview-sandbox-janitor
    namespace: {{ .Values.previewSandbox.namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: preview-sandbox-janitor
  namespace: {{ .Values.previewSandbox.namespace }}
  labels:
    krateo.io/purpose: preview-sandbox
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.previewSandbox.janitor.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            krateo.io/purpose: preview-sandbox
            app.kubernetes.io/component: preview-sandbox-janitor
        spec:
          serviceAccountName: preview-sandbox-janitor
          restartPolicy: Never
          containers:
            - name: janitor
              image: {{ .Values.previewSandbox.janitor.image }}
              command: ["/bin/bash", "-ec"]
              args:
                - |
                  ns="${SANDBOX_NAMESPACE:?}"
                  ttl="${TTL:-24h}"
                  case "$ttl" in
                    *h) secs=$(( ${ttl%h} * 3600 )) ;;
                    *m) secs=$(( ${ttl%m} * 60 )) ;;
                    *s) secs=$(( ${ttl%s} )) ;;
                    *)  secs=$(( ttl )) ;;
                  esac
                  # creationTimestamp is RFC3339 UTC -> lexicographic compare vs the cutoff is exact.
                  cutoff="$(date -u -d "@$(( $(date -u +%s) - secs ))" +%Y-%m-%dT%H:%M:%SZ)"
                  echo "janitor: namespace=${ns} ttl=${ttl} cutoff=${cutoff}"
                  deleted=0
                  for r in ${RESOURCES:?}; do
                    while read -r name ts; do
                      [[ -z "${name}" ]] && continue
                      if [[ "${ts}" < "${cutoff}" ]]; then
                        kubectl delete "${r}" "${name}" -n "${ns}" --ignore-not-found
                        deleted=$(( deleted + 1 ))
                      fi
                    done < <(kubectl get "${r}" -n "${ns}" -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.creationTimestamp}{"\n"}{end}' 2>/dev/null || true)
                  done
                  echo "janitor: deleted ${deleted} expired draft(s)"
              env:
                - name: SANDBOX_NAMESPACE
                  value: {{ .Values.previewSandbox.namespace | quote }}
                - name: TTL
                  value: {{ .Values.previewSandbox.ttl | quote }}
                - name: RESOURCES
                  value: "{{- range .Values.previewSandbox.widgetPlurals }}{{ . }}.widgets.templates.krateo.io {{ end }}restactions.templates.krateo.io"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
{{- end }}
