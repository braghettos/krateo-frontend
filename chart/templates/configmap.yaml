apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-config-vars
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  config.json: |
    {"api":{
{{- /* Effective config: when the chart provisions the preview sandbox, PREVIEW_SANDBOX_NAMESPACE
       is forced to previewSandbox.namespace so config and provisioning cannot drift.
       Disabled (default): the plain values.config passes through (empty string = feature OFF). */ -}}
{{- $config := deepCopy .Values.config -}}
{{- if .Values.previewSandbox.enabled -}}
{{- $_ := set $config "PREVIEW_SANDBOX_NAMESPACE" .Values.previewSandbox.namespace -}}
{{- end -}}
{{- $local := dict "first" true -}}
{{- range $k, $v := $config -}}
{{- if not $local.first -}},{{- end -}}
{{- if kindIs "string" $v }}
  {{ quote $k | indent 6 }}: {{ quote $v }}
{{- else }}
  {{ quote $k | indent 6 }}: {{ $v }}
{{- end }}
{{- $_ := set $local "first" false -}}
{{- end -}}
    },
    "params":{
      "FRONTEND_NAMESPACE": "{{ .Release.Namespace }}",
      "DELAY_SAVE_NOTIFICATION": "10000"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}